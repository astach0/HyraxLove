<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I love you more</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Gochi+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #ffe9f1;
      --bg-bottom: #fff4dc;
      --ink: #5a3a2e;
      --pink: #ff6fa3;
      --pink-deep: #e84a86;
      --card: #ffffff;
      --shadow: rgba(140, 70, 60, .22);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--ink);
      font-family: "Fredoka", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vh, 36px);
      padding: 32px 16px 56px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hearts drifting up in the background */
    .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .bg-hearts span {
      position: absolute;
      bottom: -40px;
      opacity: .55;
      animation: drift linear infinite;
    }
    @keyframes drift {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(-115vh) rotate(25deg); }
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-weight: 700;
      font-size: clamp(2.6rem, 10vw, 5.5rem);
      line-height: 1.05;
      text-align: center;
      color: var(--pink);
      text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(232, 74, 134, .18);
      animation: pop-in .9s cubic-bezier(.2, 1.6, .4, 1) both;
    }
    h1 .heart { display: inline-block; animation: beat 1.2s ease-in-out infinite; }

    @keyframes pop-in {
      from { transform: scale(.3) rotate(-8deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.18); }
    }

    .stage { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }

    /* The hyrax polaroid — tap target */
    .hyrax {
      position: relative;
      border: 0;
      padding: 12px 12px 18px;
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 14px 30px var(--shadow);
      cursor: pointer;
      transform: rotate(-3deg);
      animation: wobble 3.5s ease-in-out infinite, pop-in .9s .25s cubic-bezier(.2, 1.6, .4, 1) both;
      transition: transform .15s;
      width: min(440px, 100%);
    }
    .hyrax:hover { animation-play-state: paused; }
    .hyrax:active { transform: scale(.95) rotate(-3deg); }
    .hyrax:focus-visible { outline: 4px dashed var(--pink); outline-offset: 6px; }
    .hyrax img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      object-position: 45% 50%;
      border-radius: 14px;
    }
    .hyrax .caption {
      display: block;
      margin-top: 10px;
      font-family: "Gochi Hand", cursive;
      font-size: 1.35rem;
      color: var(--ink);
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(2deg) translateY(-6px); }
    }
    .hyrax.squish { animation: squish .45s ease; }
    @keyframes squish {
      0%   { transform: rotate(-3deg) scale(1); }
      30%  { transform: rotate(-3deg) scale(1.08, .9); }
      60%  { transform: rotate(-3deg) scale(.95, 1.06); }
      100% { transform: rotate(-3deg) scale(1); }
    }

    /* "boop me" sticker */
    .hint {
      position: absolute;
      top: -14px;
      right: -8px;
      background: var(--pink);
      color: #fff;
      font-family: "Gochi Hand", cursive;
      font-size: 1.2rem;
      padding: 6px 14px;
      border-radius: 999px;
      transform: rotate(10deg);
      box-shadow: 0 6px 14px rgba(232, 74, 134, .35);
      animation: bob 1.4s ease-in-out infinite;
      transition: opacity .3s;
    }
    .hint.gone { opacity: 0; }
    @keyframes bob {
      0%, 100% { transform: rotate(10deg) translateY(0); }
      50% { transform: rotate(10deg) translateY(-5px); }
    }

    /* Reveal after tapping */
    .more {
      position: relative;
      z-index: 1;
      margin: 0;
      min-height: 1.2em;
      font-family: "Gochi Hand", cursive;
      font-size: clamp(2.4rem, 9vw, 4.5rem);
      color: var(--pink-deep);
      text-align: center;
      visibility: hidden;
    }
    .more.show { visibility: visible; animation: more-pop .6s cubic-bezier(.2, 1.8, .4, 1) both; }
    @keyframes more-pop {
      from { transform: scale(0) rotate(-15deg); }
      to   { transform: scale(1) rotate(-4deg); }
    }

    /* Hearts bursting from the tap point */
    .burst {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      font-size: 1.6rem;
      animation: fly .9s ease-out forwards;
    }
    @keyframes fly {
      from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
      to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; }
    }

    footer {
      position: fixed;
      bottom: 8px;
      left: 0;
      right: 0;
      z-index: 1;
      text-align: center;
      font-size: .7rem;
      opacity: .55;
      padding: 0 16px;
    }
    footer a { color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="bg-hearts" aria-hidden="true"></div>

  <h1>I love you more <span class="heart">💛</span></h1>

  <div class="stage">
    <button class="hyrax" type="button" aria-label="Boop the hyrax">
      <span class="hint">boop me!</span>
      <img src="img/hyrax.jpg" alt="A chubby rock hyrax climbing a rock">
      <span class="caption">certified hyrax of love</span>
    </button>
  </div>

  <p class="more" aria-live="polite">mi more ;)</p>

  <footer>
    Photo: <a href="https://commons.wikimedia.org/wiki/File:Rock_hyrax_(Procavia_capensis).jpg">Charles J. Sharp</a>,
    <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>
  </footer>

  <script>
    const HEARTS = ["💛", "💕", "💖", "💗", "🩷"];
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    // Background drift
    const bg = document.querySelector(".bg-hearts");
    for (let i = 0; i < 18; i++) {
      const h = document.createElement("span");
      h.textContent = pick(HEARTS);
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = 14 + Math.random() * 22 + "px";
      h.style.animationDuration = 9 + Math.random() * 10 + "s";
      h.style.animationDelay = -Math.random() * 18 + "s";
      bg.appendChild(h);
    }

    // Boop → "much more" + heart burst
    const hyrax = document.querySelector(".hyrax");
    const more = document.querySelector(".more");
    const hint = document.querySelector(".hint");

    hyrax.addEventListener("click", e => {
      hint.classList.add("gone");

      more.classList.remove("show");
      void more.offsetWidth; // restart the pop animation
      more.classList.add("show");

      hyrax.classList.remove("squish");
      void hyrax.offsetWidth;
      hyrax.classList.add("squish");

      const rect = hyrax.getBoundingClientRect();
      const x = e.clientX || rect.left + rect.width / 2;
      const y = e.clientY || rect.top + rect.height / 2;
      for (let i = 0; i < 14; i++) {
        const b = document.createElement("span");
        b.className = "burst";
        b.textContent = pick(HEARTS);
        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 110;
        b.style.left = x + "px";
        b.style.top = y + "px";
        b.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        b.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        document.body.appendChild(b);
        b.addEventListener("animationend", () => b.remove());
      }
    });
  </script>
</body>
</html>
